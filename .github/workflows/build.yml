name: Build and test LAN wallpaper
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Sender tests
        run: node --check wallpaper2.js && node --test tests\wallpaper2.test.cjs
      - name: Receiver tests (offscreen rendering and loopback UDP only)
        run: dotnet run --project receiver\Receiver.Tests -c Release
      - name: Installer tests
        run: .\tests\install.test.ps1
      - name: Build self-contained B package
        run: .\scripts\Build-Package.ps1 -OutputDirectory artifacts\SignalRGB-Wallpaper-Receiver-win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: SignalRGB-Wallpaper-Receiver-win-x64
          path: |
            artifacts\*.zip
            artifacts\*.sha256
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SignalRGB-Wallpaper-Receiver-win-x64
          path: artifacts
      - name: Publish fork receiver
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath .\artifacts -File | Where-Object Extension -In '.zip', '.sha256' | ForEach-Object FullName)
          gh release create $env:GITHUB_REF_NAME --verify-tag --generate-notes @assets
